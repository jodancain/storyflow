name: StoryFlow checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: storyflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STORYFLOW_DATA_DIR: /tmp/storyflow-ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk python3-venv
      - run: python3 -m venv /tmp/storyflow-python && /tmp/storyflow-python/bin/pip install pypdf==6.1.1
      - run: echo 'PYTHON=/tmp/storyflow-python/bin/python' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run doctor -- --json
      - run: npm run check
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-report
          path: playwright-report/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t storyflow:ci .
      - name: Container health, media dependencies, dedicated volume persistence
        run: |
          docker volume create storyflow-ci-data
          docker run -d --name storyflow-ci -p 127.0.0.1:18296:18296 -v storyflow-ci-data:/data/storyflow storyflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18296/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18296/healthz
          docker exec storyflow-ci npm run doctor -- --json
          docker exec storyflow-ci node -e "const fs=require('fs'); if(process.getuid()===0)throw Error('root');fs.writeFileSync('/data/storyflow/persistence-check','retained')"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync,readFileSync} from 'node:fs';
          const base='http://127.0.0.1:18296';
          const setup=await fetch(`${base}/api/auth/setup`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:'ci-storyflow-fixture-password'})});
          assert.equal(setup.status,200);
          const cookie=setup.headers.get('set-cookie')?.split(';')[0];
          assert.ok(cookie);
          const created=await fetch(`${base}/api/projects`,{method:'POST',headers:{'content-type':'application/json',cookie},body:JSON.stringify({name:'CI volume recovery fixture',template:'lupus-v6'})});
          assert.equal(created.status,201);
          const project=await created.json();
          assert.equal(project.ontology.shots.length,20);
          const manifest=JSON.parse(readFileSync('examples/lupus-v6.assets.json','utf8'));
          const candidateCount=(manifest.candidates || []).length;
          const expectedFiles=manifest.files.length+(manifest.candidates || []).reduce((n,c)=>n+1+Number(Boolean(c.original))+Number(Boolean(c.thumbnail)),0);
          assert.equal(project.files.length,expectedFiles);
          assert.equal(project.artifacts.filter(a=>a.kind==='image').length,candidateCount);
          assert.equal(project.jobs.length,0,'Template history must never enqueue provider calls');
          const file=project.files[0];
          writeFileSync('/tmp/storyflow-ci-project.json',JSON.stringify({cookie,id:project.id,revision:project.revision,fileCount:expectedFiles,candidateCount,file:{id:file.id,sha256:file.sha256,bytes:file.bytes}}),{mode:0o600});
          console.log(`Created real template project: 20 shots, ${expectedFiles} files, ${candidateCount} pending image candidates.`);
          JS
          docker rm -f storyflow-ci
          docker run -d --name storyflow-ci -p 127.0.0.1:18296:18296 -v storyflow-ci-data:/data/storyflow storyflow:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18296/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18296/healthz
          docker exec storyflow-ci node -e "if(require('fs').readFileSync('/data/storyflow/persistence-check','utf8')!=='retained')process.exit(1)"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,unlinkSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const state=JSON.parse(readFileSync('/tmp/storyflow-ci-project.json','utf8'));
          const base='http://127.0.0.1:18296',headers={cookie:state.cookie};
          const response=await fetch(`${base}/api/projects/${state.id}`,{headers});
          assert.equal(response.status,200,'The same persisted session must work after container replacement');
          const project=await response.json();
          assert.equal(project.id,state.id);
          assert.equal(project.revision,state.revision);
          assert.equal(project.ontology.shots.length,20);
          assert.equal(project.files.length,state.fileCount);
          assert.equal(project.artifacts.filter(a=>a.kind==='image').length,state.candidateCount);
          assert.equal(project.jobs.length,0);
          const file=project.files.find(f=>f.id===state.file.id);
          assert.equal(file?.sha256,state.file.sha256);
          const download=await fetch(`${base}/api/files/${state.file.id}?download=1`,{headers});
          assert.equal(download.status,200);
          const bytes=Buffer.from(await download.arrayBuffer());
          assert.equal(bytes.length,state.file.bytes);
          assert.equal(createHash('sha256').update(bytes).digest('hex'),state.file.sha256);
          unlinkSync('/tmp/storyflow-ci-project.json');
          console.log('Recovered actual project and session; downloaded asset SHA-256 verified.');
          JS
      - name: Container logs
        if: failure()
        run: docker logs storyflow-ci
      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/storyflow-ci-project.json
          docker rm -f storyflow-ci
          docker volume rm storyflow-ci-data
