# Optional future reverse-proxy template. Not mounted by the local compose file.
# Keep this listener private until TLS and PUBLIC_BASE_URL are configured.
server {
    listen 127.0.0.1:18297;
    server_name localhost;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:18296;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
}
