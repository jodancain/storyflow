name: storyflow-local
services:
  storyflow:
    build: .
    image: storyflow:local
    ports:
      - "127.0.0.1:${STORYFLOW_PORT:-18296}:18296"
    environment:
      HOST: 0.0.0.0
      PORT: 18296
      STORYFLOW_DATA_DIR: /data/storyflow
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:18296}
      STORYFLOW_ADMIN_PASSWORD: ${STORYFLOW_ADMIN_PASSWORD:-}
      STORYFLOW_PUBLIC_REVIEW_PROJECTS: ${STORYFLOW_PUBLIC_REVIEW_PROJECTS:-}
      STORYFLOW_PUBLIC_REVIEW_API_BASE: ${STORYFLOW_PUBLIC_REVIEW_API_BASE:-/api}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      OPUS_BASE_URL: ${OPUS_BASE_URL:-}
      OPUS_API_KEY: ${OPUS_API_KEY:-}
      OPUS_MODEL: ${OPUS_MODEL:-claude-opus-5-5}
      SEEDANCE_BASE_URL: ${SEEDANCE_BASE_URL:-}
      SEEDANCE_API_KEY: ${SEEDANCE_API_KEY:-}
      SEEDANCE_MODEL: ${SEEDANCE_MODEL:-seedance-2-0}
      FAL_KEY: ${FAL_KEY:-}
      LIPSYNC_PROVIDER: ${LIPSYNC_PROVIDER:-fal}
      VOLCENGINE_ACCESS_KEY_ID: ${VOLCENGINE_ACCESS_KEY_ID:-}
      VOLCENGINE_SECRET_ACCESS_KEY: ${VOLCENGINE_SECRET_ACCESS_KEY:-}
    volumes:
      - storyflow-data:/data/storyflow
    tmpfs:
      - /tmp:mode=1777,size=1g
    shm_size: 256mb
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  storyflow-data:
    name: storyflow-local-data
